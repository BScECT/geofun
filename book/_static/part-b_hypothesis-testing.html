or(let i=1; i&lt;g+2; i++) x += p[i]/(z+i);\n        let t = z + g + 0.5;\n        return Math.sqrt(2*Math.PI) * Math.pow(t, z+0.5) * Math.exp(-t) * x;\n    }\n\n    // --- PDFs ---\n    function norm_pdf(x) {\n        return Math.exp(-0.5*x*x) / Math.sqrt(2*Math.PI);\n    }\n\n    function t_pdf(x, df) {\n        return gamma((df+1)/2) /\n               (Math.sqrt(df*Math.PI) * gamma(df/2)) *\n               Math.pow(1 + x*x/df, -(df+1)/2);\n    }\n\n    // --- Normal inverse CDF ---\n    function erfinv(x) {\n        let a = 0.147;\n        let ln = Math.log(1 - x*x);\n        let first = 2/(Math.PI*a) + ln/2;\n        let second = ln/a;\n        return Math.sign(x)*Math.sqrt(Math.sqrt(first*first - second) - first);\n    }\n\n    function norm_ppf(p) {\n        return Math.sqrt(2) * erfinv(2*p - 1);\n    }\n\n    // --- Numerical CDF for t (trapezoidal integration) ---\n    function t_cdf(x, df) {\n        const N = 200;  // resolution (tradeoff speed vs accuracy)\n        const xmin = -40;  // sufficiently far in tail\n        let dx = (x - xmin) / N;\n\n        let sum = 0.5 * t_pdf(xmin, df);\n        for (let i = 1; i &lt; N; i++) {\n            let xi = xmin + i * dx;\n            sum += t_pdf(xi, df);\n        }\n        sum += 0.5 * t_pdf(x, df);\n\n        return sum * dx;\n    }\n\n    // --- Accurate t quantile via bisection ---\n    function t_ppf(p, df) {\n        // --- Step 1: find a valid bracket ---\n        let lo = -1;\n        let hi = 1;\n\n        // Expand until CDF(lo) &lt; p &lt; CDF(hi)\n        while (t_cdf(lo, df) &gt; p) {\n            lo *= 2;\n        }\n        while (t_cdf(hi, df) &lt; p) {\n            hi *= 2;\n        }\n\n        // --- Step 2: bisection ---\n        let mid;\n        for (let i = 0; i &lt; 40; i++) {\n            mid = 0.5 * (lo + hi);\n            let cdf = t_cdf(mid, df);\n\n            if (cdf &lt; p) {\n                lo = mid;\n            } else {\n                hi = mid;\n            }\n        }\n\n
